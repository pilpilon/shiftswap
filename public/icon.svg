<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CCFF00" />
      <stop offset="100%" stop-color="#a3cc00" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#CCFF00" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="4" />
  <rect x="44" y="44" width="424" height="424" rx="76" fill="none" stroke="#CCFF00" stroke-opacity="0.15" stroke-width="2" />
  
  <!-- Modern aesthetic grid lines -->
  <path d="M 0 256 L 512 256" stroke="#CCFF00" stroke-opacity="0.1" stroke-width="2" stroke-dasharray="12 12" />
  <path d="M 256 0 L 256 512" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2" stroke-dasharray="12 12" />

  <text x="256" y="280" font-family="'Heebo', system-ui, sans-serif" font-weight="900" font-style="italic" font-size="124" fill="url(#textGrad)" text-anchor="middle" dominant-baseline="middle" filter="url(#neonGlow)" letter-spacing="4">SHIFT</text>
